name: Verify ScreenNote
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install lint dependencies
        run: npm install -D eslint eslint-plugin-react prettier
      - name: Run lint
        run: npx eslint . --max-warnings=0
          cache: npm
      - run: npm audit --audit-level=high
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test ! -e dist/fixture.js && test ! -e dist/matrix.html
