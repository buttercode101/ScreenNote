name: ScreenNote Cloudflare rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/cloudflare-web-first
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "90cefa028781f749f5816c5748f04cd2"
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - name: Require D1 credentials when schema migrations change
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_D1_API_TOKEN == '' }}
        shell: bash
        run: |
          before="${{ github.event.before || '' }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- rebuild/worker/migrations | grep -q .; then
            echo "::error::D1 migration files changed but CLOUDFLARE_D1_API_TOKEN is not configured. Add the dedicated D1 write token before deploying schema changes."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SCREENNOTE_WORKER_FIRST_ALL: "1"
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screennote-e2e-failure-diagnostics
          path: rebuild/test-results/**
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: screennote-build-output
          path: rebuild/.cloudflare/output/v1/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screennote-visual-evidence
          path: rebuild/test-results/screenshots/**
          if-no-files-found: warn
      - name: Apply D1 migrations with the dedicated database token
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_D1_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/apply-migrations.mjs
      - name: Warn when D1 migration credentials are not configured
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_D1_API_TOKEN == '' }}
        run: echo "::warning::D1 migrations were skipped. Apply any pending SQL in Cloudflare before deploying schema changes."
      - name: Deploy isolated Cloudflare development Worker
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          SCREENNOTE_WORKER_FIRST_ALL: "1"
        run: npm run deploy
      - name: Verify deployed app and real share lifecycle
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/live-smoke.mjs
      - name: Verify deployed UI and real D1/R2 through a separate guest browser
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          SCREENNOTE_LIVE_URL: https://screennote-dev.buttercoder-dev.workers.dev
        run: node scripts/live-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screennote-live-browser-evidence
          path: rebuild/test-results/live-browser-smoke/**
          if-no-files-found: warn
          retention-days: 3

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - run: echo "ScreenNote rebuild build gate passed."
