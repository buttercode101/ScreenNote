name: ScreenNote Cloudflare rebuild

on:
  push:
    branches:
      - rebuild/cloudflare-web-first
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: screennote-build-output
          path: rebuild/.cloudflare/output/v1/**
          if-no-files-found: error

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - run: echo "ScreenNote rebuild build gate passed."
