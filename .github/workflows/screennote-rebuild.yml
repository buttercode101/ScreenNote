name: ScreenNote Cloudflare rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/cloudflare-web-first
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rebuild/**"
      - ".github/workflows/screennote-rebuild.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "90cefa028781f749f5816c5748f04cd2"
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: screennote-build-output
          path: rebuild/.cloudflare/output/v1/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screennote-visual-evidence
          path: rebuild/test-results/screenshots/**
          if-no-files-found: warn
      - name: Deploy isolated Cloudflare development Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - run: echo "ScreenNote rebuild build gate passed."
