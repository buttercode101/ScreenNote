name: Production sharing acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live-sharing.yml', 'scripts/live-smoke.mjs']
permissions:
  contents: read
concurrency:
  group: screennote-live-sharing
  cancel-in-progress: false
jobs:
  synthetic-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate a real recording above the former sharing limit
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 65 -c:v libvpx -b:v 4M -minrate 4M -maxrate 4M -bufsize 8M -deadline realtime -cpu-used 6 -c:a libopus -b:a 64k "$RUNNER_TEMP/65s-sharing.webm"
          node -e 'const s=require("fs").statSync(process.env.RUNNER_TEMP+"/65s-sharing.webm").size; if(s<=25000000||s>50000000)throw Error("Fixture must cross the old limit: "+s);console.log({fixtureBytes:s,duration:65})'
      - name: Verify upload, playback integrity, permissions, feedback and cleanup
        env:
          QA_CLEANUP_FILE: ${{ runner.temp }}/screennote-qa-cleanup-private.json
        run: node scripts/live-smoke.mjs https://screennote-woad.vercel.app "$RUNNER_TEMP/65s-sharing.webm" 65
